# Include inside the existing TLS server block only.
# The release directory contains an eldercare/ child with the static export.
location = /eldercare {
  return 308 /eldercare/;
}

location ^~ /eldercare/ {
  root /var/www/eldercare/current;
  index index.html;
  autoindex off;
  try_files $uri $uri/ =404;
  error_page 404 /eldercare/404.html;

  # The registration index is 1.8 MB as JSON and about 260 KB with gzip.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types application/json application/javascript text/javascript text/css text/plain;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  add_header X-Robots-Tag 'noindex, nofollow' always;
  add_header Cache-Control 'no-cache' always;
}
