name: Verify release

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test release switching and rollback
        run: python3 tests/test-plan-eldercare-sync.py -q && bash tests/test-release-eldercare.sh
      - run: npm run verify:release
