name: Deploy eldercare preview

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload and switch the Tencent preview site after verification
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: eldercare-tencent-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NEXT_PUBLIC_ELDERCARE_BASE_PATH: /eldercare
    steps:
      - name: Require the reviewed main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Only the main branch can be deployed.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test release switching and rollback
        run: bash tests/test-release-eldercare.sh
      - name: Verify public release
        run: npm run verify:release
      - name: Package versioned static export
        run: |
          printf '%s\n' "$GITHUB_SHA" > out/release.txt
          ./node_modules/.bin/tsx scripts/check-public-output.ts
          tar -czf eldercare.tar.gz -C out .
          sha256sum eldercare.tar.gz > eldercare.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: eldercare-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            eldercare.tar.gz
            eldercare.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: tencent-preview
      url: https://124.223.86.157/eldercare/
    env:
      DEPLOY_HOST: 124.223.86.157
      DEPLOY_PORT: ${{ vars.ELDERCARE_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ vars.ELDERCARE_SSH_USER }}
      PUBLIC_BASE: https://124.223.86.157/eldercare
      RELEASE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eldercare-preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Check deployment configuration and SSH host identity
        env:
          DEPLOY_KEY: ${{ secrets.ELDERCARE_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ELDERCARE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ || ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ || -z "$DEPLOY_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo 'Configure the SSH user, port, private key and trusted known_hosts in the tencent-preview environment.' >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" > /dev/null
          host_lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          if ! ssh-keygen -F "$host_lookup" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo 'The trusted known_hosts entry does not match the deployment host and port.' >&2
            exit 1
          fi
          cat > "$HOME/.ssh/config" <<EOF
          Host eldercare-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile $HOME/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            BatchMode yes
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Upload and switch static release
        id: switch
        run: |
          set -euo pipefail
          remote_dir="eldercare-actions/$RELEASE_KEY"
          ssh eldercare-target "mkdir -p $remote_dir"
          scp eldercare.tar.gz eldercare.tar.gz.sha256 deploy/release-eldercare.sh "eldercare-target:$remote_dir/"
          ssh eldercare-target "bash $remote_dir/release-eldercare.sh deploy $RELEASE_KEY $GITHUB_SHA $remote_dir"
      - name: Check the public release marker and homepage
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if marker="$(curl -fsS --max-time 20 "$PUBLIC_BASE/release.txt")" && [[ "$marker" == "$GITHUB_SHA" ]] && curl -fsSI --max-time 20 "$PUBLIC_BASE/" > /dev/null; then
              echo "Published commit $GITHUB_SHA"
              exit 0
            fi
            echo "Public smoke check attempt $attempt failed; retrying." >&2
            sleep 3
          done
          exit 1
      - name: Restore previous release after failed smoke check
        if: failure() && (steps.switch.outcome == 'success' || steps.switch.outcome == 'failure')
        run: ssh eldercare-target "bash eldercare-actions/$RELEASE_KEY/release-eldercare.sh rollback $RELEASE_KEY $GITHUB_SHA"
