name: Deploy eldercare preview

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Upload and switch the Tencent preview site after verification
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: eldercare-tencent-preview
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the reviewed main branch
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Only the main branch can be deployed.' >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test release switching and rollback
        run: python3 tests/test-plan-eldercare-sync.py -q && bash tests/test-release-eldercare.sh
      - name: Verify types and behavior
        run: npm run typecheck && npm test
      - name: Build and scan prefixed static export
        env:
          NEXT_PUBLIC_ELDERCARE_BASE_PATH: /eldercare
        run: npm run build
      - name: Package versioned static export
        run: |
          printf '%s\n' "$GITHUB_SHA" > out/release.txt
          ./node_modules/.bin/tsx scripts/check-public-output.ts
          if find out -type l -print -quit | grep -q .; then
            echo 'The public static export may not contain symlinks.' >&2
            exit 1
          fi
          (cd out && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > eldercare.manifest.sha256
          tar -czf eldercare.tar.gz -C out .
          sha256sum eldercare.tar.gz > eldercare.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: eldercare-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            eldercare.tar.gz
            eldercare.tar.gz.sha256
            eldercare.manifest.sha256
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: build
    if: inputs.deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: tencent-preview
      url: https://124.223.86.157/eldercare/
    env:
      DEPLOY_HOST: 124.223.86.157
      DEPLOY_PORT: ${{ vars.ELDERCARE_SSH_PORT || '22' }}
      DEPLOY_USER: ${{ vars.ELDERCARE_SSH_USER }}
      PUBLIC_BASE: https://124.223.86.157/eldercare
      RELEASE_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: eldercare-preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify and unpack build artifact
        run: |
          set -euo pipefail
          sha256sum -c eldercare.tar.gz.sha256
          mkdir -p "$RUNNER_TEMP/eldercare-out"
          tar -xzf eldercare.tar.gz -C "$RUNNER_TEMP/eldercare-out" --no-same-owner
          (cd "$RUNNER_TEMP/eldercare-out" && sha256sum -c --quiet "$GITHUB_WORKSPACE/eldercare.manifest.sha256")
      - name: Check deployment configuration and SSH host identity
        env:
          DEPLOY_KEY: ${{ secrets.ELDERCARE_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ELDERCARE_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ ! "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_.-]*$ || ! "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ || -z "$DEPLOY_KEY" || -z "$DEPLOY_KNOWN_HOSTS" ]]; then
            echo 'Configure the SSH user, port, private key and trusted known_hosts in the tencent-preview environment.' >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/id_deploy" > /dev/null
          host_lookup="$DEPLOY_HOST"
          if [[ "$DEPLOY_PORT" != 22 ]]; then host_lookup="[$DEPLOY_HOST]:$DEPLOY_PORT"; fi
          if ! ssh-keygen -F "$host_lookup" -f "$HOME/.ssh/known_hosts" > /dev/null; then
            echo 'The trusted known_hosts entry does not match the deployment host and port.' >&2
            exit 1
          fi
          cat > "$HOME/.ssh/config" <<EOF
          Host eldercare-target
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            Port $DEPLOY_PORT
            IdentityFile $HOME/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile $HOME/.ssh/known_hosts
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF
          chmod 600 "$HOME/.ssh/config"
      - name: Synchronize changed files and switch static release
        id: switch
        timeout-minutes: 30
        run: |
          set -euo pipefail
          command -v python3 > /dev/null && command -v tar > /dev/null
          tar --version | grep -q 'GNU tar'
          ssh eldercare-target "command -v sha256sum > /dev/null && tar --version | grep -q 'GNU tar'"
          remote_dir="eldercare-actions/$RELEASE_KEY"
          ssh eldercare-target "mkdir -p $remote_dir"
          scp deploy/release-eldercare.sh "eldercare-target:$remote_dir/"
          remote_tree="$(ssh eldercare-target "bash $remote_dir/release-eldercare.sh prepare $RELEASE_KEY $GITHUB_SHA")"
          expected_release="/var/www/eldercare/releases/gha-$RELEASE_KEY-$GITHUB_SHA"
          expected_tree="$expected_release/eldercare"
          if [[ "$remote_tree" != "$expected_tree" ]]; then
            echo 'The prepared release path did not match this run.' >&2
            exit 1
          fi
          delta_dir="$RUNNER_TEMP/eldercare-delta"
          mkdir -p "$delta_dir"
          scp "eldercare-target:$expected_release/.previous-manifest.sha256" "$delta_dir/previous.sha256"
          python3 scripts/plan-eldercare-sync.py --previous "$delta_dir/previous.sha256" --next eldercare.manifest.sha256 --changed "$delta_dir/changed.paths.nul" --removed "$delta_dir/removed.paths.nul" --summary "$delta_dir/summary.json"
          if [[ -s "$delta_dir/changed.paths.nul" ]]; then
            (cd "$RUNNER_TEMP/eldercare-out" && tar --null --verbatim-files-from --hard-dereference -czf "$delta_dir/changed.tar.gz" -T "$delta_dir/changed.paths.nul")
            echo "Changed archive bytes: $(stat -c %s "$delta_dir/changed.tar.gz")"
            scp "$delta_dir/changed.tar.gz" "eldercare-target:$remote_dir/"
          else
            echo 'No changed files to upload.'
          fi
          scp "$delta_dir/changed.paths.nul" "$delta_dir/removed.paths.nul" eldercare.manifest.sha256 "eldercare-target:$remote_dir/"
          ssh eldercare-target "bash $remote_dir/release-eldercare.sh apply $RELEASE_KEY $GITHUB_SHA $remote_dir"
          ssh eldercare-target "bash $remote_dir/release-eldercare.sh activate $RELEASE_KEY $GITHUB_SHA $remote_dir"
      - name: Check the public release marker and homepage
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/eldercare-out"
          catalog="$export_dir/quanguo/pingtai/index.html"
          detail="$(find "$export_dir/quanguo/pingtai" -mindepth 2 -maxdepth 2 -type f -name index.html -print -quit)"
          article="$(find "$export_dir/quanguo/pingtai" -mindepth 4 -maxdepth 4 -type f -name index.html -print -quit)"
          if [[ ! -s "$catalog" || -z "$detail" || -z "$article" ]]; then
            echo 'The export needs a catalog, institution detail and article for the public smoke check.' >&2
            exit 1
          fi
          for attempt in 1 2 3; do
            if marker="$(curl -fsS --max-time 20 "$PUBLIC_BASE/release.txt")" && [[ "$marker" == "$GITHUB_SHA" ]] && curl -fsS --max-time 20 -o /dev/null "$PUBLIC_BASE/"; then
              pages_ok=true
              for page in "$catalog" "$detail" "$article"; do
                relative="${page#"$export_dir/"}"
                route="${relative%index.html}"
                if ! curl -fsS --max-time 20 -o /dev/null "$PUBLIC_BASE/$route"; then
                  pages_ok=false
                  break
                fi
              done
              if [[ "$pages_ok" == true ]]; then
                echo "Published commit $GITHUB_SHA"
                exit 0
              fi
            fi
            echo "Public smoke check attempt $attempt failed; retrying." >&2
            sleep 3
          done
          exit 1
      - name: Restore previous release after failed smoke check
        if: failure() && (steps.switch.outcome == 'success' || steps.switch.outcome == 'failure')
        run: ssh eldercare-target "if [ -f eldercare-actions/$RELEASE_KEY/release-eldercare.sh ]; then bash eldercare-actions/$RELEASE_KEY/release-eldercare.sh rollback $RELEASE_KEY $GITHUB_SHA; fi"
      - name: Remove a never-activated candidate after transfer failure
        if: failure() && steps.switch.outcome == 'failure'
        continue-on-error: true
        run: ssh eldercare-target "if [ -f eldercare-actions/$RELEASE_KEY/release-eldercare.sh ]; then bash eldercare-actions/$RELEASE_KEY/release-eldercare.sh abort $RELEASE_KEY $GITHUB_SHA; fi"
      - name: Remove temporary upload files
        if: always() && steps.switch.outcome != 'skipped'
        continue-on-error: true
        run: ssh eldercare-target "rm -rf -- eldercare-actions/$RELEASE_KEY"
